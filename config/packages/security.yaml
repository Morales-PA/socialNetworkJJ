security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:security:
    # Proveedores de usuarios que pueden usar los firewalls:
    providers:
        app_user_provider:                 
            entity:
                class: App\Entity\Medico    # La entidad
                property: usuario           # Atributo de la clase que es el nombre de usuario
    
    # Hasheo de las claves de los usuarios
    # en este caso están escritas en texto plano (plaintext) en la base de datos
    password_hashers:
        App\Entity\Medico:
                algorithm: plaintext
                ignore_case: true
    
    # Firewalls (hay 2, si te fijas)
    firewalls:
        dev:                                # ===== Firewall de desarrollo ===== no lo toques, te permite acceder al profiler si estropeas algo
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:                               # ===== Firewall principal =====
            lazy: true                      # Todas las páginas se pueden ver estando autorizado (o no)
            provider: app_user_provider     # Los usuarios salen del proveedor declarado arriba con la entidad Medico
            form_login:
                login_path: app_login       # Ruta al controlador de login
                check_path: app_login       # Ruta a la que se envían el POST del formulario de login
                default_target_path: portal_clinico # Si hay autenticación correcta, el controlador a dónde se manda al usuario
            logout:
                path: /logout               # Ruta inventada (y declarada aquí) para hacer el logout
                target: app_login           # Si se le desloguea bien, a dónde se le manda

    access_control:                         # Qué páginas se protegen y cuáles no: esta tarea se la delegamos a los controladores
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
            lazy: true
            provider: users_in_memory

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
