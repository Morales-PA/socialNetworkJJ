security:
   # Proveedores de usuarios que pueden usar los firewalls:
    providers:
        app_user_provider:                 
            entity:
                class: App\Entity\Usuarios    # La entidad
                property: correo                # Atributo de la clase que es el nombre de usuario

     # Hasheo de las claves de los usuarios
    # en este caso están escritas en texto plano (plaintext) en la base de datos
    password_hashers:
        App\Entity\Usuarios:
                algorithm: plaintext #CAMBIAR PARA HASHEAR LAS CONTRASEÑAS
                ignore_case: true

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login       # Ruta al controlador de login
                check_path: login       # Ruta a la que se envían el POST del formulario de login
                default_target_path: after_login # Si hay autenticación correcta, el controlador a dónde se manda al usuario
            logout:
                path: /logout               # Ruta inventada (y declarada aquí) para hacer el logout
                target: login

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon}
